# Build, vet, and test on every push + PR — the green-before-merge gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck scripts/cloud-setup.sh scripts/release.sh
      - name: golangci-lint (standard linters + the dependency/purity contracts in .golangci.yml)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
